name: Compile check

# Быстрая проверка компиляции скриптов без сборки плеера (~4-6 минут).
# Запуск: Actions -> "Compile check" -> Run workflow.
# Полезно, чтобы быстро получить список ошибок C# после правок.

on:
  workflow_dispatch:

env:
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.20f1-base-3.2.2

jobs:
  compile:
    name: Compile scripts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pull Unity image
        run: docker pull "$UNITY_IMAGE"

      - name: Compile project
        id: unity
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          mkdir -p logs Library
          docker run --rm \
            -e UNITY_EMAIL \
            -e UNITY_PASSWORD \
            -v "$PWD:/project" \
            -w /project \
            "$UNITY_IMAGE" \
            bash -lc '
              set -o pipefail
              CLIENT=$(find /opt/unity -name "Unity.Licensing.Client" -type f 2>/dev/null | head -1)
              chmod +x "$CLIENT" || true
              "$CLIENT" --activate-all --include-personal \
                 --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" > logs/activation.log 2>&1 \
                 || { echo "::error::License activation failed"; cat logs/activation.log; exit 1; }
              /opt/unity/Editor/Unity -batchmode -nographics -quit \
                -projectPath /project \
                -logFile - 2>&1 | tee logs/compile.log
              status=${PIPESTATUS[0]}
              echo "Unity exit code: $status"
              exit $status
            '

      - name: Compiler errors
        if: always()
        run: |
          echo "=== error CS ==="
          grep -hoE "Assets/[^(]+\([0-9]+,[0-9]+\): error CS[0-9]+: [^\r]*" logs/compile.log 2>/dev/null | sort -u || echo "(нет ошибок компиляции)"
          echo "=== last lines ==="
          tail -n 25 logs/compile.log 2>/dev/null || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: logs/compile.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if compilation failed
        if: steps.unity.outcome != 'success'
        run: exit 1
