name: Unity license

# Активация Unity на аккаунте (Personal / бесплатная лицензия) для CI-сборок.
#
# Запуск: Actions -> "Unity license" -> Run workflow.
#
# Используется официальный клиент лицензирования Unity, который умеет получать
# Personal-место (seat) прямо по логину/паролю Unity ID:
#
#   Unity.Licensing.Client --activate-all --include-personal \
#       --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD"
#
# Ручной способ через license.unity3d.com/manual для бесплатных лицензий Unity
# больше не поддерживает (офлайн-активация осталась только для Enterprise).
#
# Если у аккаунта включена двухфакторная аутентификация, клиент потребует код:
# в этом случае добавьте секрет UNITY_TOTP_KEY (секрет аутентификатора).

on:
  workflow_dispatch:

env:
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.20f1-base-3.2.2

jobs:
  activate:
    name: Activate license
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pull Unity image
        run: docker pull "$UNITY_IMAGE"

      - name: Activate Personal seat via Unity licensing client
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_TOTP_KEY: ${{ secrets.UNITY_TOTP_KEY }}
        run: |
          mkdir -p license
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::warning::Секреты UNITY_EMAIL / UNITY_PASSWORD не заданы - пропускаю активацию."
            exit 0
          fi
          docker run --rm \
            -e UNITY_EMAIL \
            -e UNITY_PASSWORD \
            -e UNITY_TOTP_KEY \
            -v "$PWD/license:/out" \
            -w /out \
            "$UNITY_IMAGE" \
            bash -lc '
              set -o pipefail
              CLIENT=$(find /opt/unity /usr/share/unity3d -name "Unity.Licensing.Client" -type f 2>/dev/null | head -1)
              if [ -z "$CLIENT" ]; then
                echo "LICENSING_CLIENT_NOT_FOUND"; find / -name "Unity.Licensing.Client*" 2>/dev/null | head -5; exit 0
              fi
              echo "licensing client: $CLIENT"
              chmod +x "$CLIENT" 2>/dev/null || true
              "$CLIENT" --activate-all --include-personal \
                 --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | tail -50 || true

              echo "---- license state ----"
              find "$HOME/.local/share/unity3d" -maxdepth 3 -type f 2>/dev/null | head -40
              echo "---- export ----"
              mkdir -p /out/state
              for f in $(find "$HOME/.local/share/unity3d/Unity" -maxdepth 1 -type f 2>/dev/null); do
                cp -v "$f" /out/ 2>/dev/null || true
              done
              cp -a "$HOME/.local/share/unity3d/Unity/." /out/state/ 2>/dev/null || echo "nothing to copy"
              ls -la /out /out/state 2>/dev/null || true
            '

      - name: Report what was produced
        run: |
          echo "=== license/ ==="
          ls -la license || true
          if ls license/*.ulf >/dev/null 2>&1; then
            echo "::notice title=ULF получен::Файл .ulf создан автоматически."
          else
            echo "::warning title=ULF не создан::Смотрите лог шага активации (2FA? неверный пароль?)."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-license
          path: license
          if-no-files-found: warn
          retention-days: 14

  check-license:
    name: Check stored license
    runs-on: ubuntu-latest
    needs: activate
    if: always()
    steps:
      - name: License secrets status
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "UNITY_LICENSE: set ($(echo -n "$UNITY_LICENSE" | wc -c) bytes)"
          else
            echo "UNITY_LICENSE: NOT set"
          fi
          [ -n "$UNITY_SERIAL" ]   && echo "UNITY_SERIAL: set"   || echo "UNITY_SERIAL: NOT set"
          [ -n "$UNITY_EMAIL" ]    && echo "UNITY_EMAIL: set"    || echo "UNITY_EMAIL: NOT set"
          [ -n "$UNITY_PASSWORD" ] && echo "UNITY_PASSWORD: set" || echo "UNITY_PASSWORD: NOT set"
