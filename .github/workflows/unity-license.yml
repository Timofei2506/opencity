name: Unity license

# Получение файла лицензии для game-ci (Personal / бесплатный Unity).
#
# Запуск: Actions -> "Unity license" -> Run workflow.
#
# Джоба "activate" пробует активировать Personal-лицензию автоматически по
# UNITY_EMAIL / UNITY_PASSWORD прямо в контейнере с Unity. Если Unity создаст
# Unity_lic.ulf — он появится в артефакте "unity-license".
#
# Если автоактивация не сработала (Unity требует ручного подтверждения),
# используйте артефакт "unity-activation-file" (.alf):
#   1) скачать .alf;
#   2) загрузить на https://license.unity3d.com/manual (нужен вход в Unity ID);
#   3) получить .ulf и положить его содержимое в секрет UNITY_LICENSE.
#
# Готовый .ulf также лежит локально после активации Unity Hub:
#   Windows: C:\ProgramData\Unity\Unity_lic.ulf
#   macOS:   /Library/Application Support/Unity/Unity_lic.ulf
#   Linux:   ~/.local/share/unity3d/Unity/Unity_lic.ulf

on:
  workflow_dispatch:

env:
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.20f1-base-3.2.2

jobs:
  activate:
    name: Activate license
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pull Unity image
        run: docker pull "$UNITY_IMAGE"

      - name: Activate Personal license with Unity ID credentials
        continue-on-error: true
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          mkdir -p license
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::warning::Секреты UNITY_EMAIL / UNITY_PASSWORD не заданы - пропускаю автоактивацию."
            exit 0
          fi
          docker run --rm \
            -e UNITY_EMAIL \
            -e UNITY_PASSWORD \
            -v "$PWD/license:/out" \
            -w /out \
            "$UNITY_IMAGE" \
            bash -lc '
              /opt/unity/Editor/Unity -batchmode -nographics -quit -logFile - \
                -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" 2>&1 | tail -60 || true
              echo "---- licensing client state ----"
              ls -la "$HOME/.local/share/unity3d/Unity" 2>/dev/null || echo "no license dir"
              echo "---- export ----"
              cp -v "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf" /out/ \
                || echo "NO_ULF_FILE_CREATED"
              ls -la /out
            '

      - name: Create manual activation file (.alf)
        continue-on-error: true
        run: |
          mkdir -p license
          docker run --rm \
            -v "$PWD/license:/out" \
            -w /out \
            "$UNITY_IMAGE" \
            bash -lc '
              /opt/unity/Editor/Unity -batchmode -nographics -createManualActivationFile -logFile - 2>&1 | tail -40 || true
              ls -la /out
            '

      - name: Report what was produced
        run: |
          echo "=== license/ ==="
          ls -la license || true
          if ls license/*.ulf >/dev/null 2>&1; then
            echo "::notice title=ULF получен::Файл .ulf создан автоматически. Его можно положить в секрет UNITY_LICENSE."
          else
            echo "::warning title=ULF не создан::Нужен ручной путь через .alf (см. описание workflow)."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-license
          path: license
          if-no-files-found: warn
          retention-days: 14

  check-license:
    name: Check stored license
    runs-on: ubuntu-latest
    needs: activate
    if: always()
    steps:
      - name: License secrets status
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "UNITY_LICENSE: set ($(echo -n "$UNITY_LICENSE" | wc -c) bytes)"
          else
            echo "UNITY_LICENSE: NOT set"
          fi
          [ -n "$UNITY_SERIAL" ]   && echo "UNITY_SERIAL: set"   || echo "UNITY_SERIAL: NOT set"
          [ -n "$UNITY_EMAIL" ]    && echo "UNITY_EMAIL: set"    || echo "UNITY_EMAIL: NOT set"
          [ -n "$UNITY_PASSWORD" ] && echo "UNITY_PASSWORD: set" || echo "UNITY_PASSWORD: NOT set"
