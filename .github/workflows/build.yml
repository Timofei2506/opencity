name: Build game

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Tools/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 2022.3.20f1
  IMAGE_TAG: 3.2.2

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 64-bit
            target: StandaloneWindows64
            image: unityci/editor:ubuntu-2022.3.20f1-windows-mono-3.2.2
            method: OpenCity.EditorTools.BuildScript.BuildWindowsCI
            output: build/Windows64
            artifact: OpenCity-Windows64
          - name: Linux 64-bit
            target: StandaloneLinux64
            image: unityci/editor:ubuntu-2022.3.20f1-base-3.2.2
            method: OpenCity.EditorTools.BuildScript.BuildLinuxCI
            output: build/Linux64
            artifact: OpenCity-Linux64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Verify Unity credentials
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error title=Нет учётных данных Unity::Добавьте секреты репозитория UNITY_EMAIL и UNITY_PASSWORD (логин и пароль Unity ID)."
            exit 1
          fi
          echo "Credentials present."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.target }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.target }}-
            Library-

      - name: Free disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/lib/jvm /opt/az 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:"; df -h / | tail -1

      - name: Pull Unity image
        run: |
          docker pull "${{ matrix.image }}"
          docker image inspect "${{ matrix.image }}" --format 'image size: {{.Size}} bytes'
          echo "CPU: $(nproc), RAM: $(free -g | awk '/Mem:/ {print $2}') GB"
          echo "disk after pull:"; df -h / | tail -1

      - name: Activate Personal license and build
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          mkdir -p Library "${{ matrix.output }}" logs
          docker run --rm \
            -e UNITY_EMAIL \
            -e UNITY_PASSWORD \
            -v "$PWD:/project" \
            -w /project \
            "${{ matrix.image }}" \
            bash -lc '
              set -o pipefail

              CLIENT=$(find /opt/unity -name "Unity.Licensing.Client" -type f 2>/dev/null | head -1)
              if [ -z "$CLIENT" ]; then
                echo "::error::Unity.Licensing.Client not found in image"
                exit 1
              fi
              chmod +x "$CLIENT" || true
              echo "== licensing client: $CLIENT"
              if ! "$CLIENT" --activate-all --include-personal \
                     --username "$UNITY_EMAIL" --password "$UNITY_PASSWORD" 2>&1 | tee logs/activation.log; then
                echo "::error title=Активация лицензии не удалась::Проверьте UNITY_EMAIL/UNITY_PASSWORD (и 2FA) — см. logs/activation.log"
                exit 1
              fi
              if grep -qi "Unauthorized\|Invalid Credential" logs/activation.log; then
                echo "::error title=Unity отклонил учётные данные::Проверьте пароль Unity ID или включённую двухфакторную аутентификацию"
                exit 1
              fi

              echo "== disk inside container =="; df -h /project | tail -1
              echo "== building ${{ matrix.target }}"
              /opt/unity/Editor/Unity -batchmode -nographics -quit \
                -projectPath /project \
                -buildTarget ${{ matrix.target }} \
                -executeMethod ${{ matrix.method }} \
                -logFile - 2>&1 | tee logs/build.log
              status=${PIPESTATUS[0]}
              echo "Unity exit code: $status"
              exit $status
            '

      - name: Show build log tail on failure
        if: failure()
        run: |
          tail -n 120 logs/build.log 2>/dev/null || true
          grep -E "error CS[0-9]+|Scripts have compiler errors|Aborting batchmode" logs/build.log 2>/dev/null | head -60 || true

      - name: Verify build output
        run: |
          echo "=== ${{ matrix.output }} ==="
          find "${{ matrix.output }}" -maxdepth 2 -type f | head -30
          test -n "$(find "${{ matrix.output }}" -maxdepth 1 -type f -name 'OpenCity*' -print -quit)" \
            || { echo "::error::Executable not produced"; exit 1; }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.target }}
          path: logs
          if-no-files-found: ignore
          retention-days: 7

  summary:
    name: Build summary
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Report
        run: |
          echo "Windows 64-bit: ${{ needs.build.result }}"
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::warning title=Сборка не завершилась::Смотрите артефакт logs-* и лог шага 'Activate Personal license and build'."
          fi
